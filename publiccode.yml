description:
  it:
    shortDescription: "EduWISP — Policy Engine"
    longDescription: "Definizione, composizione e risoluzione delle policy scolastiche, familiari e di sicurezza, con calcolo della policy effettiva. Fa parte di EduWISP, piattaforma open source e gratuita per la gestione dei dispositivi digitali di proprietà delle scuole, con MDM, gestione scolastica, Family Control e prevenzione del cyberbullismo. Il progetto è in fase di progettazione e rispetta come vincolo bloccante il GDPR e la normativa italiana su privacy e minori. Documentazione: https://eduwisp.org/docs/"
    documentation: "https://eduwisp.org/docs/"
    features:
      - "Policy Engine"
  en:
    shortDescription: "EduWISP — Policy Engine"
    longDescription: "Definition, composition and resolution of school, family and security policies, computing the effective policy. Part of EduWISP, a free and open-source platform to manage school-owned digital devices, with MDM, school management, family control and cyberbullying prevention. The project is in the design phase and treats GDPR and Italian law on privacy and minors as a blocking constraint. Documentation: https://eduwisp.org/docs/en/"
    documentation: "https://eduwisp.org/docs/en/"
    features:
      - "Policy Engine"

